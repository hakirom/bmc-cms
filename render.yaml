# Blueprint de Render para el CMS, reutilizando la base de datos Neon existente.
# Uso: Render → New → Blueprint → apuntar a este repositorio.
#
# DATABASE_URL queda como `sync: false`: Render la pedirá al desplegar y usted
# pega ahí la cadena de Neon. Si prefiere que Render cree su propio Postgres,
# sustituya ese bloque por `fromDatabase` y añada una sección `databases`.
services:
  - type: web
    name: bmc-cms
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 1337

      # Secretos generados por Render: no hay que copiarlos a ningún sitio
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      - key: DATABASE_CLIENT
        value: postgres
      # Pegue aquí la cadena de Neon. Use el endpoint DIRECTO (sin `-pooler`):
      # en un servicio persistente el pool lo gestiona Strapi.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MIN
        value: '0'
      - key: DATABASE_POOL_MAX
        value: '5'

      # Dominio del front, para CORS
      - key: FRONTEND_URLS
        sync: false
