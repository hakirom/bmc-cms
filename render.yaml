# Blueprint de Render: crea el CMS y su Postgres de una vez.
# Uso: Render → New → Blueprint → apuntar a este repositorio.
#
# Si prefiere Neon en lugar del Postgres de Render, borre el bloque `databases`
# y cambie DATABASE_URL por `sync: false` para pegarla en el panel.
services:
  - type: web
    name: bmc-cms
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 1337

      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: bmc-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: 'false'
      - key: DATABASE_POOL_MIN
        value: '0'
      - key: DATABASE_POOL_MAX
        value: '5'

      # Dominio del front, para CORS. Se define en el panel tras desplegarlo.
      - key: FRONTEND_URLS
        sync: false

databases:
  - name: bmc-postgres
    plan: free
    databaseName: bmc
    user: bmc
