# Sustituya TU_ORGANIZACION por la clave que le asigne SonarQube Cloud al crear
# la organización (aparece en la URL: sonarcloud.io/organizations/<clave>).
sonar.organization=TU_ORGANIZACION
sonar.projectKey=hakirom_bmc-cms
sonar.projectName=BMC CMS (Strapi)

# Código propio. Se incluye la infraestructura: Sonar analiza Terraform y
# detecta problemas de seguridad en la definición de recursos.
sonar.sources=src,config,infra,infra-azure
sonar.sourceEncoding=UTF-8

# Generado, descargado o efímero: no es código que se revise.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.tmp/**,types/generated/**,**/.terraform/**

# Aún no hay pruebas: la cobertura saldrá en 0 %. Es correcto y esperado.
